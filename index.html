<!DOCTYPE html>

<html>
  <head>

        <meta charset="utf-8">

        <title>Clippy Editor</title>

        <link rel="icon" href="https://clippi.neocities.org/images/clippy%20transparent%20copy.gif">

       <link rel="stylesheet" href="https://unpkg.com/98.css">
<style>
.bubble {
    position: relative;
    background: #ffef7a;
    color: black;
  
    font-size: 10px;
    line-height: 17px;

    text-align: left;
    width: 123px;
    height: 70px;
    border-radius: 3px;
    padding: 3px;
    left:30px;
}
.bubble:after {
    content: '';
    position: absolute;
    display: block;
    width: 0;
    z-index: 1;
    border-style: solid;
    border-width: 28px 15px 0 0;
    border-color: #ffef7a transparent transparent transparent;
    bottom: -25px;
    left: 24%;
    margin-left: -19.5px;
}

body {
    background-size: cover;
    background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6vxTRtbI2ENLFzbPUqc1iqImWvTRkKHFEVgVtkjy5QoYk9vzgP300-Qg&s=10');
}
.btn {
    text-align:right;
    position: fixed;
    left:1px;
    bottom: 10px;
    width: 100%;
    min-height: 31px;
    height: 31px;
}
.btnimage {
  position: absolute;
  left: 6px;
  top: 3px;

}
.move {
  position: absolute;
  right: 230px;
  top: 50%;
  transform: translateY(-50%);

}
.clip {
position: absolute;
margin-top: 50px;
left: 100px;
}
.win2 {
  position: absolute;
  left: 222px;
  top: 30px;

}
.clipimg {
  margin-top: 30px;
}
</style>

  </head>

<body>

<img src="https://www.cs.oberlin.edu/~rms/mmcc/a/icons/Desk.gif" alt="Desktop - Windows 95"/>

<button onclick="check()" class="default">Submit</button>

<div class="win2">
  <div class="window" style="width: 650px">
    <div class="title-bar">
      <div class="title-bar-text">Enter your text here</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
         </div>
      </div>
    <div class="field-row-stacked" style="width: 650px">
      <label for="intext"> </label>
      <textarea style="background-color:#dfdfdf" id="intext" rows="15"></textarea>
    </div>
  </div>
</div>
       
<div class="clip">
  <div class="window"  style="width: 300px">
    <div class="title-bar">
     <div  class="title-bar-text">Clippy</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>
    <div class="window-body">
      <div class="bubble" id="message">My recommendations will show here</div>
        <img class="clipimg" id="image" width= "30%" src="https://clippi.neocities.org/images/clippy%20transparent%20copy.gif" alt="Word Clippy GIFs | Tenor"/>
      </div>
    </div>
</div>


<div class="move">
  <div class="window"  style="width: 200px">
    <div class="title-bar">
      <div id="message" class="title-bar-text">DVD LOGO</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>
    <div class="window-body">
      <img id="image" width="180px"  src="https://user-images.githubusercontent.com/19642322/66207589-d054c500-e6bb-11e9-9d84-a0fbb5d2ef93.gif" alt="Word Clippy GIFs | Tenor"/>
    </div>
  </div>
</div>





<button class="btn"> <span id="time"></span>  <img class="btnimage" width= "60px" src="https://preview.redd.it/can-anybody-make-the-windows-95-start-button-v0-qtzmgvma70py.gif?format=png8&amp;s=36bce96569a266be6345aada4bfd4d1e14b3f029" alt="windows95startbtn"/></button>

<script>
var time = 0

var animate = 0

var rand1 = Math.random()

var today = new Date();

document.getElementById('time').innerHTML=today;

function check() {

  document.getElementById("image").src="https://clippi.neocities.org/images/clippy%20transparent%20copy.gif"

  document.getElementById("image").style.width = "30%"

  const input = document.getElementById("intext")

  const textInput = input.value.toLowerCase().trim()

  if (textInput.includes("dear") || textInput.includes("hi") || textInput.includes("sincerely") || textInput.includes("thanks") || textInput.includes("hello")){

  if (rand2 === 0){

  document.getElementById("message").textContent = "I see you are writing a letter, I would recommend adding sincerely to sound professional"

  document.getElementById("image").src="https://www.wallender.com/wp-content/uploads/2019/06/clippy.gif"

  document.getElementById("image").style.width = "25%"

  speech()

  } else if (rand2 === 1) {

  document.getElementById("message").textContent = "I see you are writing a letter, I would recommend making a good greeting"

  document.getElementById("image").src="https://www.wallender.com/wp-content/uploads/2019/06/clippy.gif"

  document.getElementById("image").style.width = "25%"

  speech()

  } else if (rand2 === 2) {
rand2 = Math.floor(Math.random() * 2);
  }

  rand1 = Math.random()

  } else if (textInput.includes("hate") || textInput.includes("dislike")) {

  document.getElementById("message").textContent = "Hey, those are some strong words please don't say that."

  document.getElementById("image").src="https://www.wallender.com/wp-content/uploads/2019/06/clippy.gif"

  document.getElementById("image").style.width = "25%"

  speech()

  } else if (textInput.includes("experience") || textInput.includes("education")) {

  document.getElementById("message").textContent = "I see you might be writing a resume. I would recommend sounding professional."

  document.getElementById("image").src="https://www.wallender.com/wp-content/uploads/2019/06/clippy.gif"

  document.getElementById("image").style.width = "25%"

  speech()

  } else {

  document.getElementById("message").textContent = "No recommendations you are amazing"

  speech()

  }

}

function speech() {

  const talk = document.getElementById("message").textContent

  const speech = new SpeechSynthesisUtterance(talk);

  speech.rate = 0.8

  speech.pitch = 0.4

  window.speechSynthesis.speak(speech)

}


function animation() {

  if (animate === 1) {

    document.getElementById("image").src="https://64.media.tumblr.com/018635f36c5b24858523a85a0c8c2089/tumblr_p4r7wxprps1tuvwugo2_250.gifv";

  }
  if (animate === 2) {

    document.getElementById("image").src="https://slackmojis.com/emojis/2216-clippy3d/download";

  }
  if (animate === 3) {

    document.getElementById("message").textContent = "I'm Bored I'm Bored I'm Bored"

    speech()

    document.getElementById("image").src="https://clippi.neocities.org/images/clippy%20transparent%20copy.gif";


  }

  if (animate ===4) {

    document.getElementById("image").src="https://www.lappage.net/shared/windows98/clippy.gif"

  }
  if (animate ===5) {

    document.getElementById("message").textContent = "I'm Bored I'm Bored I'm Bored"

    document.getElementById("image").src="https://clippi.neocities.org/images/clippy%20transparent%20copy.gif";

  }
  if (animate===6){
    animate = 0;
  }


}


function timing() {
animation()
animate +=1
var rand2 = Math.floor(Math.random() * 2);
  console.log(rand2);
}



    const intervalId = setInterval(timing, 5000);






</script>      
    </body>

</html>
